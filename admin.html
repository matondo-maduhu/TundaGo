<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TundaGo Admin</title><link rel="stylesheet" href="style.css"></head><body><header><div class="top"><b class="brand">TundaGo <span>Admin</span></b></div></header><main>
<section class="panel" id="login"><label>Admin token<input id="token" type="password" placeholder="Token uliyoweka Vercel"></label><button class="primary" onclick="login()">Ingia</button></section>
<div id="app" hidden><div class="tabs"><button id="t1" class="on" onclick="tab(1)">Oda</button><button id="t2" onclick="tab(2)">Bidhaa</button></div>
<section id="p1"><label>Chuja hali<select id="flt" onchange="renderOrders()"><option value="">Zote</option></select></label><div id="stats" class="notice"></div><div id="orders"></div></section>
<section id="p2" hidden><div id="prods"></div></section></div></main><script>
const ST=['pending','preparing','delivering','completed','cancelled'],LB={pending:'Mpya',paid:'Imelipwa',preparing:'Inaandaliwa',delivering:'Iko njiani',completed:'Imekamilika',cancelled:'Imefutwa'};
let tok=sessionStorage.getItem('tok')||'',orders=[],prods=[];
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'TSh '+Number(n).toLocaleString('en-US');
async function api(u,body){const r=await fetch(u,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','x-admin-token':tok},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;}
$('#flt').innerHTML+=ST.map(s=>`<option value="${s}">${LB[s]}</option>`).join('');
async function login(){tok=$('#token').value;try{await load();sessionStorage.setItem('tok',tok);$('#login').hidden=true;$('#app').hidden=false;}catch(e){alert(e.message);}}
async function load(){orders=(await api('/api/admin/orders')).orders;prods=(await api('/api/admin/products')).products;renderOrders();renderProds();}
function tab(n){$('#p1').hidden=n!=1;$('#p2').hidden=n!=2;$('#t1').className=n==1?'on':'';$('#t2').className=n==2?'on':'';}
function renderOrders(){
 const f=$('#flt').value,today=new Date().toDateString(),td=orders.filter(o=>new Date(o.created_at).toDateString()===today&&o.status!=='cancelled');
 $('#stats').innerHTML=`Leo: oda <b>${td.length}</b> · mauzo <b>${money(td.reduce((a,o)=>a+Number(o.total_amount),0))}</b> · zinazosubiri: <b>${orders.filter(o=>['pending','paid','preparing','delivering'].includes(o.status)).length}</b>`;
 $('#orders').innerHTML=orders.filter(o=>!f||o.status===f).map(o=>{const ph=o.phone.replace(/\D/g,'').replace(/^0/,'255');return `<article class="panel"><h3>Oda #${o.id} · ${esc(o.name)}</h3><p><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a> · <a href="https://wa.me/${ph}">WhatsApp</a><br>${esc(o.delivery_location)}</p><p>${o.items.map(i=>esc(i.product_name)+' × '+i.quantity).join('<br>')}</p>${o.notes?`<p><i>${esc(o.notes)}</i></p>`:''}<p><b>${money(o.total_amount)}</b> (delivery ${money(o.delivery_fee)})<br>${o.payment_method==='cod'?'Cash':'Simu ref: <b>'+esc(o.payment_reference)+'</b>'} · <span class="badge ${o.payment_status==='paid'?'':'bad'}">${o.payment_status==='paid'?'Imelipwa':'Haijalipwa'}</span> <span class="badge">${LB[o.status]||o.status}</span><br><small>${new Date(o.created_at).toLocaleString()}</small></p>${o.status==='cancelled'?'':`<select id="s${o.id}">${ST.map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${LB[s]}</option>`).join('')}</select><div class="btns"><button class="primary" onclick="upd(${o.id},{status:$('#s${o.id}').value})">Hifadhi hali</button>${o.payment_status!=='paid'?`<button class="primary" onclick="upd(${o.id},{payment_status:'paid'})">Weka imelipwa</button>`:''}</div>`}</article>`}).join('')||'<p>Hakuna oda.</p>';
}
async function upd(id,b){if(b.status==='cancelled'&&!confirm('Futa oda hii? Stock itarudishwa.'))return;try{await api('/api/admin/update-order',{order_id:id,...b});await load();}catch(e){alert(e.message);}}
function renderProds(){
 const row=p=>`<article class="panel"><label>Jina<input id="n${p.id}" value="${esc(p.name)}"></label><div class="row"><label>Bei (TSh)<input id="p${p.id}" type="number" value="${p.price}"></label><label>Stock<input id="k${p.id}" type="number" value="${p.stock}"></label><label>Kipimo<input id="u${p.id}" value="${esc(p.unit)}"></label><label>Inaonekana<select id="a${p.id}"><option value="1">Ndiyo</option><option value="0" ${p.is_available?'':'selected'}>Hapana</option></select></label></div><label>Picha (URL)<input id="i${p.id}" value="${esc(p.image_url)}"></label><button class="primary" onclick="saveP(${p.id||0})">${p.id?'Hifadhi':'Ongeza bidhaa'}</button></article>`;
 $('#prods').innerHTML=row({id:0,name:'',price:0,stock:0,unit:'moja',image_url:'',is_available:true}).replace('<article class="panel">','<article class="panel"><h3>Bidhaa mpya</h3>')+prods.map(row).join('');
}
async function saveP(id){const g=k=>$('#'+k+id).value;try{await api('/api/admin/products',{id,name:g('n'),price:g('p'),stock:Number(g('k')),unit:g('u'),image_url:g('i'),is_available:g('a')==='1'});await load();}catch(e){alert(e.message);}}
if(tok){$('#token').value=tok;login();}
</script></body></html>
