<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TundaGo Admin</title><link rel="stylesheet" href="style.css"></head><body><header><div class="top"><b class="brand">TundaGo <span>Admin</span></b></div></header><main><section class="panel"><h1>Admin orders</h1><label>Admin token<input id="token" type="password" placeholder="Token uliyoweka Vercel"></label><button class="primary" onclick="loadOrders()">Load orders</button><div id="orders"></div></section></main><script>
const statuses=['pending','paid','preparing','delivering','completed','cancelled'];function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function loadOrders(){const box=document.querySelector('#orders');box.innerHTML='Loading...';try{const r=await fetch('/api/admin/orders',{headers:{'x-admin-token':document.querySelector('#token').value}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');box.innerHTML=(d.orders||[]).map(o=>`<article class="panel"><h3>Order #${o.id} · ${esc(o.name)}</h3><p>${esc(o.phone)} · ${esc(o.delivery_location)}</p><p><b>TSh ${Number(o.total_amount).toLocaleString()}</b> · Payment: ${esc(o.payment_status)}</p><p>Status: ${esc(o.status)} · ${new Date(o.created_at).toLocaleString()}</p><label>Change status<select id="status-${o.id}">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></label><button class="primary" onclick="updateOrder(${o.id})">Save status</button></article>`).join('')||'No orders';}catch(e){box.textContent=e.message;}}async function updateOrder(id){const status=document.querySelector('#status-'+id).value;const r=await fetch('/api/admin/update-order',{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':document.querySelector('#token').value},body:JSON.stringify({order_id:id,status})});const d=await r.json();if(!r.ok){alert(d.error||'Failed');return;}alert('Status updated');loadOrders();}
</script></body></html>
